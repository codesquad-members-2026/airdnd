spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:airdnd-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email
  sql:
    init:
      mode: never

aws:
  region: ap-northeast-2
  credentials:
    access-key: test-access-key
    secret-key: test-secret-key
  s3:
    bucket: test-bucket
    public-base-url: https://cdn.example.test
    presign-expiry-seconds: 300
