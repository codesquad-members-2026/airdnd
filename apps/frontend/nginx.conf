# 외부(Cloudflare)가 준 X-Forwarded-Proto가 있으면 그걸 그대로,
# 없으면(직접 접속 등) 현재 nginx scheme 사용 → OAuth redirect_uri 가 https로 잡히게
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

# 80 → 443 리다이렉트 (직접 접속 대비). Cloudflare Full(strict)은 origin 443으로 접속.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Cloudflare Origin Certificate (런타임에 마운트됨)
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산 + SPA 라우팅 폴백 (새로고침/딥링크 시 index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → 백엔드(Spring). 컨테이너 네트워크에서 서비스명 'backend'로 접근
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # OAuth2 로그인 시작 (예: /oauth2/authorization/google) → 백엔드
    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # OAuth2 콜백 (/login/oauth2/code/google) → 백엔드
    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
