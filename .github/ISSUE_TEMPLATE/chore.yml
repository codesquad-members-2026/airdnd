name: 🔧 작업 환경 설정
description: CI/CD, 빌드 설정, 의존성 업데이트 등
title: "[CHORE] "
labels: ["chore"]
body:
  - type: input
    attributes:
      label: 부모 이슈
      placeholder: "#이슈번호 (없으면 비워주세요)"

  - type: textarea
    attributes:
      label: 작업 내용
      placeholder: 변경할 설정이나 작업 내용을 설명해주세요
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: 체크리스트
      options:
        - label: 로컬 빌드 확인
        - label: 셀프 리뷰 완료