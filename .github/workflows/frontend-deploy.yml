name: Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches:
      - main
    paths:
      - apps/frontend/**
      - docs/api/**
      - .env.example
      - .gitattributes
      - .gitignore
      - .github/workflows/frontend-deploy.yml

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      VITE_ENABLE_MOCKS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          if-no-files-found: error

  deploy-placeholder:
    name: Deployment Hook Placeholder
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Explain next deployment step
        run: |
          echo "Frontend artifact was built successfully."
          echo "Add provider-specific deployment steps here when the frontend target is decided."
