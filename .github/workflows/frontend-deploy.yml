name: Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches:
      - main
    paths:
      - apps/frontend/**
      - docs/api/**
      - .env.example
      - .gitattributes
      - .gitignore
      - .github/workflows/frontend-deploy.yml

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # NOTE: the Playwright e2e suite is intentionally NOT run here. It requires
      # a real backend at :8080 (see playwright.config.ts) which CI doesn't
      # provide — the MSW mock layer was scaffolded (src/mocks/) but never
      # implemented, so VITE_ENABLE_MOCKS has no effect. Run `npm run e2e`
      # locally against a running backend. Re-add a job here once mocks exist
      # or a backend is provisioned in CI.

      # Job-level env keeps VITE_ENABLE_MOCKS=true for the test steps above
      # (e2e has no real backend in CI). The PROD build must NOT ship mocks and
      # must point at the real API, so we override env on THIS step only —
      # step env wins over job env.
      - name: Build
        env:
          VITE_ENABLE_MOCKS: "false"
          # Same CloudFront domain as the SPA → /api and /oauth2 are same-origin
          # (no CORS, cookies flow). APP_BASE_URL = https://<dist>.cloudfront.net.
          VITE_API_BASE_URL: ${{ vars.APP_BASE_URL }}
          VITE_OAUTH_BASE_URL: ${{ vars.APP_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
          VITE_PAYPAL_CURRENCY: ${{ vars.VITE_PAYPAL_CURRENCY || 'USD' }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    # Same gate as the backend: auto-deploy on push to main, or manual dispatch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read  # checkout not needed, but keep read for parity
      id-token: write # OIDC token to assume the AWS deploy role
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # --delete removes files that no longer exist in the new build (old hashed
      # JS/CSS chunks), keeping the bucket in sync with dist/ exactly.
      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete

      # CloudFront caches aggressively (Managed-CachingOptimized on the SPA
      # behavior). Invalidate everything so users get the new index.html and
      # assets immediately instead of waiting for TTLs to expire.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
