name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment label
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - docs/api/**
      - docker-compose.yml
      - .env.example
      - .gitattributes
      - .gitignore
      - .github/workflows/backend-deploy.yml

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew test

      - name: Build boot jar
        run: ./gradlew bootJar

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-boot-jar
          path: apps/backend/build/libs/*.jar
          if-no-files-found: error

  deploy-placeholder:
    name: Deployment Hook Placeholder
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - name: Explain next deployment step
        run: |
          echo "Backend artifact was built successfully."
          echo "Add provider-specific deployment steps here when the backend target is decided."
