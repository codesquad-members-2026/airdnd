name: Docker Publish

# 빌드 + Docker Hub push 까지만 수행한다. EC2 배포(pull/restart)는 수동.
# 버전 번호는 입력하지 않는다 → Docker Hub의 현재 최고 vN 을 읽어 +1 (자동 증가).
# 매 빌드마다 :v<자동번호> 와 :latest 를 함께 푸시한다.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "빌드/푸시할 대상"
        type: choice
        required: true
        default: both
        options:
          - both
          - backend
          - frontend

# 동시 실행 직렬화: 두 run이 같은 다음 번호를 계산해 덮어쓰는 것 방지.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  BACKEND_IMAGE: jjjkuul/airdnd-backend
  FRONTEND_IMAGE: jjjkuul/airdnd-frontend

jobs:
  backend:
    if: ${{ inputs.target == 'both' || inputs.target == 'backend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 다음 버전 계산 (Docker Hub 최고 vN + 1)
        id: ver
        env:
          IMAGE: ${{ env.BACKEND_IMAGE }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          token=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}" | jq -r .token)
          tags=$(curl -s -H "Authorization: JWT ${token}" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags?page_size=100" \
            | jq -r '.results[].name' | grep -E '^v[0-9]+$' || true)
          max=0
          for t in ${tags}; do n=${t#v}; [ "$n" -gt "$max" ] && max=$n; done
          next=$((max + 1))
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "→ ${IMAGE}:v${next} (이전 최고 v${max})"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    if: ${{ inputs.target == 'both' || inputs.target == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 다음 버전 계산 (Docker Hub 최고 vN + 1)
        id: ver
        env:
          IMAGE: ${{ env.FRONTEND_IMAGE }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          token=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}" | jq -r .token)
          tags=$(curl -s -H "Authorization: JWT ${token}" \
            "https://hub.docker.com/v2/repositories/${IMAGE}/tags?page_size=100" \
            | jq -r '.results[].name' | grep -E '^v[0-9]+$' || true)
          max=0
          for t in ${tags}; do n=${t#v}; [ "$n" -gt "$max" ] && max=$n; done
          next=$((max + 1))
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "→ ${IMAGE}:v${next} (이전 최고 v${max})"

      # .env.production 은 gitignore라 체크아웃에 없음 → Secret으로 주입.
      # VITE_* 는 vite build 시 번들에 baked 된다.
      - name: Inject VITE env (.env.production)
        run: |
          cat > apps/frontend/.env.production <<EOF
          VITE_API_BASE_URL=
          VITE_KAKAO_JS_KEY=${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_TOSS_CLIENT_KEY=${{ secrets.VITE_TOSS_CLIENT_KEY }}
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
