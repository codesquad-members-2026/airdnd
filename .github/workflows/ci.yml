name: CI

# PR/푸시 시 빌드·테스트 검증 (배포/푸시 없음). 수동 실행도 가능.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  backend:
    name: backend (gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: gradlew 실행권한
        run: chmod +x gradlew

      - name: 테스트 (H2 인메모리)
        run: ./gradlew test --no-daemon

  frontend:
    name: frontend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # generated/ 는 gitignore라 CI 체크아웃에 없음 → 프론트 "빌드 검증"은
      # CD(이미지 빌드, openapi.json→generate→vite build)에서 수행.
      # CI는 소스 lint만 비차단으로 돌려 머지를 막지 않는다(기존 lint 부채).
      - name: Lint (비차단)
        run: npm run lint
        continue-on-error: true
